name: Release

# 发布流程：只有推送 v* 标签才触发。
on:
  push:
    tags:
      - 'v*'

env:
  MODRINTH_PROJECT: ${{ vars.MODRINTH_ID || '5tC6IJAL' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish_type: ${{ steps.meta.outputs.publish_type }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release type
        id: meta
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#[vV]}"

          PROP_VERSION="$(grep -E '^mod\.version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          if [ "$VERSION" != "$PROP_VERSION" ]; then
            echo "::error::tag 版本与 gradle.properties 不一致：tag=$VERSION, mod.version=$PROP_VERSION"
            exit 1
          fi

          LOWER="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$LOWER" == *snapshot* || "$LOWER" == *alpha* ]]; then
            TYPE="ALPHA"
          elif [[ "$LOWER" == *beta* ]]; then
            TYPE="BETA"
          else
            TYPE="STABLE"
          fi

          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "publish_type=$TYPE" >> "$GITHUB_OUTPUT"

          {
            echo "### 发布信息"
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| tag | \`$TAG\` |"
            echo "| version | \`$VERSION\` |"
            echo "| 发布类型 | \`$TYPE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT="$RUNNER_TEMP/release-notes.md"

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$OUT" || true

          if [ ! -s "$OUT" ]; then
            printf '_本次发布未在 CHANGELOG.md 中找到对应条目。_\n' > "$OUT"
          fi

          printf '\n---\n\n完整更新日志：[CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$OUT"

          echo "PUBLISH_CHANGELOG_FILE=$OUT" >> "$GITHUB_ENV"
          cat "$OUT"

      - name: Publish to GitHub and Modrinth
        id: publish
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ env.MODRINTH_PROJECT }}
          PUBLISH_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TYPE: ${{ needs.prepare.outputs.publish_type }}
          PUBLISH_TAG: ${{ needs.prepare.outputs.tag }}
          DO_PUBLISH: 'true'
        run: |
          set -euo pipefail
          ./gradlew \
            :26.3-fabric:publishGithub \
            :26.3-fabric:publishModrinth \
            :26.3-neoforge:publishModrinth \
            --continue \
            --stacktrace

      - name: Upload built jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            versions/26.3-*/build/libs/*.jar
            !versions/26.3-*/build/libs/*-sources.jar
            !versions/26.3-*/build/libs/*-dev.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize
        if: always()
        run: |
          {
            echo "### 发布结果"
            echo "- 版本：\`${{ needs.prepare.outputs.version }}\`"
            echo "- 类型：\`${{ needs.prepare.outputs.publish_type }}\`"
            echo "- 状态：\`${{ steps.publish.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any publish failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::至少有一个平台发布失败，请查看上面的日志。"
          exit 1
