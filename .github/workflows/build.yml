name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            project: ':26.3-fabric'
          - loader: neoforge
            project: ':26.3-neoforge'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew ${{ matrix.project }}:build --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeleportGUI-${{ matrix.loader }}
          path: versions/26.3-${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Summarize
        run: |
          {
            echo "### TeleportGUI ${{ matrix.loader }}"
            echo '```'
            ls -lh versions/26.3-${{ matrix.loader }}/build/libs/*.jar
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
