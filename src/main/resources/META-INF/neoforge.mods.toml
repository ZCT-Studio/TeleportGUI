modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/ZCT-Studio/TeleportGUI/issues"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
iconFile = "icon.png"
bannerFile = "banner.png"
displayURL = "https://github.com/ZCT-Studio/TeleportGUI"
authors = "${authors_toml}"
description = '''
${description}
'''

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${maven_mc_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${id}]]
modId = "geyser_neoforge"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
